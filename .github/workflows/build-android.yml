name: Build Citron (Android Nightly CPM / C++23)

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      host_only:
        description: Run only the clang-cl smoke check
        type: boolean
        default: false
      force_build:
        description: 'Rebuild and publish even if the source commit is unchanged'
        type: boolean
        default: false
      build_only:
        description: 'Build both APKs without publishing a release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dependency-integration-${{ github.ref }}-${{ inputs.host_only }}
  cancel-in-progress: false

env:
  EMULATOR_REPOSITORY: https://github.com/Splaser/emulator.git
  EMULATOR_BRANCH: codex/android-oboe-cpm
  ANDROID_NDK_VERSION: 29.0.14206865

jobs:
  check-version:
    name: Resolve Android nightly source
    if: github.event_name == 'workflow_dispatch' && inputs.host_only != true
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.source.outputs.should_build }}
      new_hash: ${{ steps.source.outputs.hash_short }}
      new_hash_full: ${{ steps.source.outputs.hash_full }}
      branch_name: ${{ steps.source.outputs.branch_name }}
    steps:
      - name: Resolve source and compare with published nightly
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
          BUILD_ONLY: ${{ inputs.build_only || false }}
        run: |
          FULL_HASH=$(git ls-remote --exit-code "$EMULATOR_REPOSITORY" "refs/heads/$EMULATOR_BRANCH" | cut -f1)
          if ! [[ "$FULL_HASH" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the emulator nightly branch"
            exit 1
          fi
          echo "branch_name=$EMULATOR_BRANCH" >> "$GITHUB_OUTPUT"
          echo "hash_short=${FULL_HASH:0:7}" >> "$GITHUB_OUTPUT"
          echo "hash_full=$FULL_HASH" >> "$GITHUB_OUTPUT"
          RELEASE_BODY=$(gh release view nightly-android --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          if [ "$FORCE_BUILD" = "true" ] || [ "$BUILD_ONLY" = "true" ] || \
             ! grep -Fq "<!-- emulator-commit:$FULL_HASH -->" <<< "$RELEASE_BODY"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building $EMULATOR_BRANCH at $FULL_HASH"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "This source commit is already published; skipping."
          fi

  build-android:
    name: Build Android APK
    needs: [check-version]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      git_hash: ${{ steps.get_hash.outputs.git_hash }}
      branch_name: ${{ needs.check-version.outputs.branch_name }}

    steps:
      - name: Clone Citron Source Code
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.check-version.outputs.new_hash_full }}
        run: |
          for attempt in {1..5}; do
            rm -rf citron_source
            if git clone --branch "$EMULATOR_BRANCH" "$EMULATOR_REPOSITORY" citron_source; then
              git -C citron_source checkout --detach "$SOURCE_COMMIT"
              test "$(git -C citron_source rev-parse HEAD)" = "$SOURCE_COMMIT"
              exit 0
            fi
            echo "Clone attempt $attempt failed"
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          exit 1

      - name: Verify source submodules remain uninitialized
        working-directory: ./citron_source
        run: |
          if git submodule status | grep -v '^-'; then
            echo "::error::A source submodule was initialized before the CPM build"
            exit 1
          fi

      - name: Get Citron Commit Hash
        id: get_hash
        working-directory: ./citron_source
        run: echo "git_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            wget unzip curl git cmake build-essential \
            pkg-config zip glslang-tools nasm perl \
            autoconf automake libtool yasm

      - name: Install Android SDK Command-line Tools
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest

      - name: Set up Android Environment Variables
        run: |
          echo "ANDROID_HOME=$PWD/android-sdk" >> $GITHUB_ENV
          echo "$PWD/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Android SDK licenses and install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV

      - name: Select NDK r29 and verify C++23 format/print
        working-directory: ./citron_source
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          path = pathlib.Path("src/android/app/build.gradle.kts")
          text, count = re.subn(r'ndkVersion = "[^"]+"', 'ndkVersion = "' + os.environ["ANDROID_NDK_VERSION"] + '"', path.read_text())
          if count != 1:
              raise SystemExit("Expected exactly one Gradle ndkVersion setting")
          path.write_text(text)
          PY
          grep 'ndkVersion' src/android/app/build.gradle.kts
          cat "$ANDROID_NDK_HOME/source.properties"
          cat > "$RUNNER_TEMP/cpp23-check.cpp" <<'CPP'
          #include <format>
          #include <print>
          #include <version>
          #ifndef __cpp_lib_format
          #error "NDK libc++ lacks std::format"
          #endif
          #ifndef __cpp_lib_print
          #error "NDK libc++ lacks std::print"
          #endif
          extern "C" void cpp23_check() { std::print("{}", std::format("{}", 23)); }
          CPP
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++" \
            -std=c++23 -shared -fPIC -Wl,--no-undefined "$RUNNER_TEMP/cpp23-check.cpp" -o "$RUNNER_TEMP/cpp23-check.so"

      - name: Build APK with Gradle
        working-directory: ./citron_source/src/android
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          chmod +x gradlew
          ./gradlew assembleMainlineRelease \
            -PcitronAndroidUseCpm=true \
            -Pcmake.args="-DENABLE_UPDATE_CHECKER=ON -DENABLE_QT=OFF -DENABLE_SDL2=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_OPENSSL=ON -DCITRON_USE_BUNDLED_VCPKG=OFF -DCITRON_USE_CPM=ON -DCITRON_USE_BUNDLED_FFMPEG=ON -DCITRON_ENABLE_LTO=ON -DCITRON_BUILD_TYPE=Nightly"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: citron-android-nightly
          path: citron_source/src/android/app/build/outputs/apk/mainline/release/*.apk
          if-no-files-found: error

  build-android-8elite:
    name: Build Android APK (Snapdragon 8 Elite)
    needs: [check-version]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      git_hash: ${{ steps.get_hash.outputs.git_hash }}
      branch_name: ${{ needs.check-version.outputs.branch_name }}

    env:
      TARGET: Lyb
      MODEL: "8 Elite"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache glslang-tools libvulkan-dev python3-requests patch

      - name: Clone Citron Source Code
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.check-version.outputs.new_hash_full }}
        run: |
          for attempt in {1..5}; do
            rm -rf citron_source
            if git clone --branch "$EMULATOR_BRANCH" "$EMULATOR_REPOSITORY" citron_source; then
              git -C citron_source checkout --detach "$SOURCE_COMMIT"
              test "$(git -C citron_source rev-parse HEAD)" = "$SOURCE_COMMIT"
              exit 0
            fi
            echo "Clone attempt $attempt failed"
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          exit 1

      - name: Verify source submodules remain uninitialized
        working-directory: ./citron_source
        run: |
          if git submodule status | grep -v '^-'; then
            echo "::error::A source submodule was initialized before the CPM build"
            exit 1
          fi

      - name: Get Citron Commit Hash
        id: get_hash
        working-directory: ./citron_source
        run: echo "git_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Apply All Patches (Snapdragon 8 Elite)
        working-directory: ./citron_source
        run: |
          echo "Applying Snapdragon 8 Elite patches..."

          # --- Patch 1: Force System Driver Load (native.cpp) ---
          sed -i '/if (!handle) {/,/}/c\    if (!handle) {\n        handle = dlopen("libvulkan.so", RTLD_NOW);\n    }' src/android/app/src/main/jni/native.cpp

          # --- Patch 2: 8 Elite Fixes for Qualcomm (vulkan_device.h) ---
          sed -i '/bool IsShaderInt64Supported() const {/a \        const auto driver = GetDriverID();\n        if (driver == VK_DRIVER_ID_QUALCOMM_PROPRIETARY) {\n            return false;\n        }' src/video_core/vulkan_common/vulkan_device.h
          sed -i '/bool IsExtShaderAtomicInt64Supported() const {/a \        const auto driver = GetDriverID();\n        if (driver == VK_DRIVER_ID_QUALCOMM_PROPRIETARY) {\n            return false;\n        }' src/video_core/vulkan_common/vulkan_device.h

          # --- Patch 3: 8 Elite & Cleanup Fixes (vulkan_device.cpp) ---
          # 3a: Delete the original `device_id` variable declaration.
          sed -i '/const auto device_id =/d' src/video_core/vulkan_common/vulkan_device.cpp

          # 3b: Replace all usages of the now-deleted `device_id` with its full source path to prevent compile errors.
          sed -i 's/\bdevice_id\b/properties.properties.deviceID/g' src/video_core/vulkan_common/vulkan_device.cpp

          # 3c: This is the corrected logic: Instead of adding a new variable, we use the `driver_id`
          # variable that already exists in the correct C++ scope. This fixes the compile error.
          sed -i 's/if (is_qualcomm) {/if (driver_id == VK_DRIVER_ID_QUALCOMM_PROPRIETARY) {/' src/video_core/vulkan_common/vulkan_device.cpp

          echo "All patches applied successfully."

      - name: Setup and Restore Cache
        uses: actions/cache@v6
        id: ccache-cache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-ccache-${{ env.ANDROID_NDK_VERSION }}-${{ env.TARGET }}-${{ github.ref_name }}-${{ hashFiles('citron_source/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-android-ccache-${{ env.ANDROID_NDK_VERSION }}-${{ env.TARGET }}-${{ github.ref_name }}-
            ${{ runner.os }}-android-ccache-${{ env.ANDROID_NDK_VERSION }}-${{ env.TARGET }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            wget unzip curl git cmake build-essential \
            pkg-config zip glslang-tools nasm perl \
            autoconf automake libtool yasm

      - name: Install Android SDK Command-line Tools
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest

      - name: Set up Android Environment Variables
        run: |
          echo "ANDROID_HOME=$PWD/android-sdk" >> $GITHUB_ENV
          echo "$PWD/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Android SDK licenses and install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV

      - name: Select NDK r29 and verify C++23 format/print
        working-directory: ./citron_source
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          path = pathlib.Path("src/android/app/build.gradle.kts")
          text, count = re.subn(r'ndkVersion = "[^"]+"', 'ndkVersion = "' + os.environ["ANDROID_NDK_VERSION"] + '"', path.read_text())
          if count != 1:
              raise SystemExit("Expected exactly one Gradle ndkVersion setting")
          path.write_text(text)
          PY
          grep 'ndkVersion' src/android/app/build.gradle.kts
          cat "$ANDROID_NDK_HOME/source.properties"
          cat > "$RUNNER_TEMP/cpp23-check.cpp" <<'CPP'
          #include <format>
          #include <print>
          #include <version>
          #ifndef __cpp_lib_format
          #error "NDK libc++ lacks std::format"
          #endif
          #ifndef __cpp_lib_print
          #error "NDK libc++ lacks std::print"
          #endif
          extern "C" void cpp23_check() { std::print("{}", std::format("{}", 23)); }
          CPP
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++" \
            -std=c++23 -shared -fPIC -Wl,--no-undefined "$RUNNER_TEMP/cpp23-check.cpp" -o "$RUNNER_TEMP/cpp23-check.so"

      - name: Compile Android APK (Snapdragon 8 Elite)
        working-directory: ./citron_source/src/android
        run: |
          # The git command needs to run from the cloned git repo to get the correct commit count
          COUNT="$(git -C ../.. rev-list --count HEAD)"
          APK_NAME="Citron-${COUNT}-Android-${MODEL}-${TARGET}"

          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          chmod +x ./gradlew
          ./gradlew assembleMainlineRelease \
            -PcitronAndroidUseCpm=true \
            -Pcmake.args="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DENABLE_UPDATE_CHECKER=ON -DENABLE_QT=OFF -DENABLE_SDL2=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_OPENSSL=ON -DCITRON_USE_BUNDLED_VCPKG=OFF -DCITRON_USE_CPM=ON -DCITRON_USE_BUNDLED_FFMPEG=ON -DCITRON_ENABLE_LTO=ON -DCITRON_BUILD_TYPE=Nightly"

          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Build failed: No APK file was found."
            exit 1
          fi

          mkdir -p artifacts
          mv "$APK_PATH" "artifacts/$APK_NAME.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: citron-android-8elite
          path: citron_source/src/android/artifacts/*.apk
          if-no-files-found: error


  release-android:
    name: Release Android Nightly
    needs: [check-version, build-android, build-android-8elite]
    if: github.ref == 'refs/heads/main' && needs.check-version.outputs.should_build == 'true' && inputs.build_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: citron-android-*
          merge-multiple: false
          path: artifacts

      - name: Validate both APK variants
        shell: bash
        run: |
          for variant in citron-android-nightly citron-android-8elite; do
            mapfile -d '' -t APKS < <(find "artifacts/$variant" -maxdepth 1 -type f -name '*.apk' -print0)
            if [ "${#APKS[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one APK in $variant, found ${#APKS[@]}"
              exit 1
            fi
            test -s "${APKS[0]}"
            unzip -t "${APKS[0]}"
          done

      - name: Remove previous nightly release after both APKs are validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly-android --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete nightly-android --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

      - name: Publish Android nightly
        uses: softprops/action-gh-release@v3
        with:
          name: "Continuous Build: (Android Nightly: ${{ needs.check-version.outputs.new_hash }})"
          tag_name: nightly-android
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: artifacts/*/*.apk
          body: |
            **Emulator commit:** [${{ needs.check-version.outputs.new_hash }}](https://github.com/Splaser/emulator/commit/${{ needs.check-version.outputs.new_hash_full }})

            Built from **Splaser/emulator main** using CPM, C++23 and Android NDK r29.
            Source submodules remain uninitialized.

            - Platform: Android (arm64-v8a)
            - Build type: Nightly with LTO and the update checker enabled
            - Variants: Standard and Snapdragon 8 Elite with Qualcomm patches
            - [Workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            <!-- emulator-commit:${{ needs.check-version.outputs.new_hash_full }} -->

  clang-cl-integration:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Splaser/emulator
          ref: e2590fa97316ff44860d57871dda47b85f2e82a6
          submodules: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Locate OpenSSL headers
        shell: pwsh
        run: |
          $roots = @('C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64', 'C:\OpenSSL-Win64')
          $include = $roots | ForEach-Object { Join-Path $_ 'include' } | Where-Object { Test-Path (Join-Path $_ 'openssl/evp.h') } | Select-Object -First 1
          if (-not $include) {
            choco install openssl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $include = $roots | ForEach-Object { Join-Path $_ 'include' } | Where-Object { Test-Path (Join-Path $_ 'openssl/evp.h') } | Select-Object -First 1
          }
          if (-not $include) { throw 'OpenSSL headers were not found' }
          "OPENSSL_INCLUDE=$include" >> $env:GITHUB_ENV
      - name: Check AES-NI and tuple/pair hashing under clang-cl
        shell: pwsh
        run: |
          @'
          #include "core/crypto/aes_ni.h"
          #include "common/container_hash.h"
          #include <cassert>
          #include <unordered_map>
          static_assert(CITRON_HAS_AES_NI == 1);
          int main() {
              Common::TupleHash hash;
              std::unordered_map<std::tuple<bool, size_t, int, int>, int, Common::TupleHash> map;
              auto key = std::tuple{true, size_t{4}, -1, 2};
              map.emplace(key, 42);
              assert(map.at(key) == 42);
              assert(hash(std::pair{-1, 2}) == hash(std::tuple{-1, 2}));
              assert(hash(std::tuple{}) == 0);
          }
          '@ | Set-Content smoke.cpp
          & 'C:\Program Files\LLVM\bin\clang-cl.exe' /std:c++latest /EHsc /Isrc "/I$env:OPENSSL_INCLUDE" /c smoke.cpp /Fo:smoke.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


  dynarmic-hash-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Splaser/dynarmic
          ref: 8c54a77b52928866d16462a6f6b9a6adfe6f1755
          fetch-depth: 0
          submodules: false
      - name: Prepare C++23 and pinned Boost headers
        run: |
          set -euo pipefail
          if ! command -v g++-14 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y g++-14
          fi
          curl -fL --retry 3 https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.bz2 -o boost.tar.bz2
          tar -xjf boost.tar.bz2 boost_1_87_0/boost
      - name: Reproduce the previous hasher failure and verify the fix
        run: |
          set -euo pipefail
          mkdir -p previous/dynarmic/common/container
          for file in unordered_map.h unordered_set.h; do
            git show "31bdd01b:src/dynarmic/common/container/$file" > "previous/dynarmic/common/container/$file"
          done
          if g++-14 -std=c++23 -Iprevious -Isrc -Iboost_1_87_0 tests/container_hash_smoke.cpp -o previous-smoke > previous.log 2>&1; then
            echo "::error::The previous hasher unexpectedly accepted descriptor keys"
            exit 1
          fi
          grep -q 'hash_value' previous.log
          grep -q 'LocationDescriptor' previous.log
          g++-14 -std=c++23 -Isrc -Iboost_1_87_0 tests/container_hash_smoke.cpp -o hash-smoke
          ./hash-smoke
