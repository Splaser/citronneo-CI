name: Build Citron (Windows default provider test)

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Optional exact emulator commit SHA; defaults to personal main'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-provider-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  EMULATOR_BRANCH: main

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Resolve exact test source
        id: source
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          commit="$SOURCE_COMMIT"
          if [[ -z "$commit" ]]; then
            commit=$(git ls-remote https://github.com/Splaser/emulator.git "refs/heads/$EMULATOR_BRANCH" | cut -f1)
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Testing $EMULATOR_BRANCH at $commit"

  windows-vcpkg:
    name: Windows MSVC / vcpkg + submodules
    needs: resolve-source
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Splaser/emulator
          ref: ${{ needs.resolve-source.outputs.commit }}
          submodules: recursive
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch history required by vcpkg version overrides
        shell: pwsh
        run: |
          $shallow = git -C externals/vcpkg rev-parse --is-shallow-repository
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($shallow -eq 'true') {
            git -C externals/vcpkg fetch --unshallow
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install pinned host shader compiler
        shell: pwsh
        run: |
          $version = '16.6.0'
          $archive = Join-Path $env:RUNNER_TEMP 'glslang.zip'
          $tools = Join-Path $env:RUNNER_TEMP "glslang-$version"
          Invoke-WebRequest -Uri "https://github.com/KhronosGroup/glslang/releases/download/$version/glslang-$version-windows-x86_64-release.zip" -OutFile $archive
          $expectedHash = '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'glslang archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          $bin = Join-Path $tools 'bin'
          $compiler = Join-Path $bin 'glslang.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'glslang executable missing' }
          # Current glslang releases renamed the CLI; Citron searches its historical name.
          $validator = Join-Path $bin 'glslangValidator.exe'
          Copy-Item -LiteralPath $compiler -Destination $validator
          & $validator --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure default Windows provider
        shell: pwsh
        run: |
          cmake -S . -B build-provider -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCITRON_USE_CPM=OFF -DCITRON_USE_BUNDLED_VCPKG=ON `
            -DENABLE_QT=OFF -DENABLE_SDL2=ON -DENABLE_CUBEB=OFF `
            -DENABLE_WEB_SERVICE=OFF -DENABLE_LIBUSB=OFF `
            -DCITRON_ROOM=OFF -DCITRON_TESTS=ON -DCITRON_CRASH_DUMPS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build CLI, shader tool and tests
        shell: pwsh
        run: |
          cmake --build build-provider --target citron-cmd shader_tool tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run tests
        run: ctest --test-dir build-provider --output-on-failure --timeout 180
      - name: Upload CLI and shader tool
        uses: actions/upload-artifact@v4
        with:
          name: citron-windows-msvc-vcpkg-test
          path: |
            build-provider/bin/citron-cmd.exe
            build-provider/bin/shader_tool.exe
          if-no-files-found: error
